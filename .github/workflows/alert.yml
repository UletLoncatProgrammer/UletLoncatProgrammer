name: Stock Alert Automation

on:
  schedule:
    # Hourly, 09:00-16:00 WIB (Jakarta, UTC+7) on weekdays
    - cron: "0 2-9 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run stock alert analysis
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python stock_alert.py --config config.json

      - name: Persist alert dedupe state
        run: |
          if [ -n "$(git status --porcelain -- alert_state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add alert_state.json
            git commit -m "Update alert dedupe state [skip ci]"
            git push
          fi
